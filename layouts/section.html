{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="entries">
  {{ range .Pages }}
  <li>
    {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>{{ end }}
    <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
